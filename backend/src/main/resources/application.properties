spring.application.name=student-registration-backend
server.port=8080
server.error.include-message=always

spring.datasource.url=jdbc:mysql://localhost:3306/student_registration
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Keep the existing MySQL schema as the source of truth; Hibernate should not change it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.security.campus-code=${CAMPUS_CODE}
