spring.application.name=student-registration-backend
server.port=${PORT:8080}
server.error.include-message=always

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_registration}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Keep the existing MySQL schema as the source of truth; Hibernate should not change it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.security.campus-code=${CAMPUS_CODE}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
